name: Verify Cloudflare migration locally
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/test-cloudflare-view-migration.mjs scripts/test-migration-transfer.mjs scripts/test-migration-identity.mjs scripts/test-migration-bridge.mjs scripts/test-migration-quota.mjs scripts/test-migration-authority-rules.mjs scripts/test-worker-authorization.mjs scripts/test-staff-access.mjs
      - run: npm --prefix functions run lint
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-helium-views --config firebase.emulator.json "node --test scripts/test-view-rules.mjs scripts/test-migration-authority-rules.mjs scripts/test-migration-rollback-firestore.mjs scripts/test-view-firestore.mjs scripts/test-comment-firestore.mjs scripts/test-monthly-report-firestore.mjs"
