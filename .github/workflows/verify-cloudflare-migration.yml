name: Verify Cloudflare migration locally
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund
      - name: Independent authority and revised view/archive sizing
        run: node --test scripts/test-authority-independent.mjs scripts/test-view-bounded-rate.mjs scripts/test-archive-local.mjs scripts/test-free-sizing.mjs
      - name: Authority pilot controller only, no cloud requests
        run: node --test scripts/test-authority-pilot-control.mjs scripts/test-authority-cpu-candidate.mjs
      - run: node --test scripts/test-cloudflare-view-migration.mjs scripts/test-migration-transfer.mjs scripts/test-migration-identity.mjs scripts/test-migration-bridge.mjs scripts/test-migration-quota.mjs scripts/test-migration-authority-rules.mjs scripts/test-worker-authorization.mjs scripts/test-staff-access.mjs
      - name: Candidate bundle correctness only (no cloud)
        run: |
          node scripts/authority-pilot/prepare-live.mjs .local/authority-cpu-candidate --candidate
          node scripts/authority-pilot/validate-live-local.mjs .local/authority-cpu-candidate
          node scripts/authority-pilot/validate-live-local.mjs .local/authority-cpu-candidate full
      - run: npm --prefix functions run lint
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-helium-views --config firebase.emulator.json "node --test scripts/test-view-rules.mjs scripts/test-migration-authority-rules.mjs scripts/test-migration-rollback-firestore.mjs scripts/test-view-firestore.mjs scripts/test-comment-firestore.mjs scripts/test-monthly-report-firestore.mjs"
