name: Update Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      # ==========================
      # CHECKOUT
      # ==========================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================
      # SETUP NODE
      # ==========================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==========================
      # GENERATE VERSION
      # ==========================

      - name: Generate data version
        run: |

          HASH=$(sha256sum assets/data/data.json | cut -d ' ' -f1)

          cat > assets/data/version.js <<EOF
          // AUTO-GENERATED BY GITHUB ACTIONS
          window.SITE_VERSION = "${HASH}";
          EOF

          echo "Data version: ${HASH}"


      # ==========================
      # GENERATE SITEMAP
      # ==========================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OG image dependency
        run: python3 -m pip install -r scripts/requirements-og.txt

      - name: Test OG image generator without network
        run: python3 scripts/test-og-images.py

      - name: Generate OG preview images
        run: python3 scripts/generate-og-images.py

      - name: Generate clean routes and sitemap
        run: python3 scripts/build-clean-urls.py

      - name: Upload generated OG images and pages for review
        uses: actions/upload-artifact@v4
        with:
          name: og-preview
          include-hidden-files: true
          path: |
            assets/og/
            manga/
            assets/js/
            assets/css/
            assets/images/
            assets/data/
            sitemap.xml


      # ==========================
      # DISCORD
      # ==========================

      - name: Send Discord notification
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |

          node scripts/discord-notify.mjs


      # ==========================
      # COMMIT GENERATED FILES
      # ==========================

      - name: Commit generated files
        if: github.event_name == 'push'
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add \
            assets/data/version.js \
            sitemap.xml \
            assets/og \
            login follow history user manga \
            admin/manga admin/chapter

          git diff --cached --quiet || \
            git commit -m "Auto update generated files"

          git push
