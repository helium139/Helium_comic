name: Update Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-release
  cancel-in-progress: false

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      # ==========================
      # CHECKOUT
      # ==========================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================
      # SETUP NODE
      # ==========================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Test chapter readiness without network or webhook
        run: node --test scripts/test-chapter-readiness.mjs


      # ==========================
      # GENERATE VERSION
      # ==========================

      - name: Generate data version
        run: |

          HASH=$(sha256sum assets/data/data.json | cut -d ' ' -f1)

          cat > assets/data/version.js <<EOF
          // AUTO-GENERATED BY GITHUB ACTIONS
          window.SITE_VERSION = "${HASH}";
          EOF

          echo "Data version: ${HASH}"


      # ==========================
      # GENERATE SITEMAP
      # ==========================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OG image dependency
        run: python3 -m pip install -r scripts/requirements-og.txt

      - name: Test OG image generator without network
        run: python3 scripts/test-og-images.py

      - name: Generate OG preview images
        run: python3 scripts/generate-og-images.py

      - name: Generate clean routes and sitemap
        run: python3 scripts/build-clean-urls.py

      - name: Upload generated OG images and pages for review
        uses: actions/upload-artifact@v4
        with:
          name: og-preview
          include-hidden-files: true
          path: |
            assets/og/
            manga/
            assets/js/
            assets/css/
            assets/images/
            assets/data/
            sitemap.xml


      # ==========================
      # COMMIT GENERATED FILES
      # ==========================

      - name: Commit generated files
        if: github.event_name == 'push'
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add \
            assets/data/version.js \
            sitemap.xml \
            assets/og \
            login follow history user manga \
            admin/manga admin/chapter

          git diff --cached --quiet || \
            git commit -m "Auto update generated files"

          git push


      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage public website
        run: |
          mkdir -p /tmp/pages-site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.agents/' --exclude='.codex/' --exclude='.aws/' --exclude='.vscode/' --exclude='scripts/' ./ /tmp/pages-site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages and wait for success
        id: deployment
        uses: actions/deploy-pages@v4

  discord:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download generated chapter HTML
        uses: actions/download-artifact@v4
        with:
          name: og-preview
          path: .

      - name: Wait for chapter and OG image, then notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/discord-notify.mjs
