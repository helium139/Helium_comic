name: Update Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-release
  cancel-in-progress: false
  queue: max

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      # ==========================
      # CHECKOUT
      # ==========================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================
      # SETUP NODE
      # ==========================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      - name: Install CMS verification dependency
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Test CMS authorization without production requests
        run: node --test scripts/test-cms-auth.mjs scripts/test-worker-authorization.mjs scripts/test-team-compatibility.mjs scripts/test-staff-access.mjs

      - name: Install local WebP verification dependencies
        run: npm ci --prefix scripts/webp --no-audit --no-fund

      - name: Test WebP conversion, migration and rollback without production requests
        run: node --test scripts/test-image-conversion.mjs scripts/test-chapter-promotion.mjs scripts/webp/test-migration.mjs scripts/webp/test-rollback.mjs scripts/webp/test-cleanup-originals.mjs

      - name: Test public pages, carousel, notifications and reading progress
        run: node --test scripts/test-admin-picks.mjs scripts/test-completed.mjs scripts/test-home-ranking.mjs scripts/test-team-pages.mjs scripts/test-reading-progress.mjs scripts/test-push-notifications.mjs

      - name: Test scoped dashboard statistics
        run: node --test scripts/test-dashboard.mjs scripts/test-admin-pagination.mjs scripts/test-admin-comments.mjs

      - name: Install Functions verification dependencies
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund

      - name: Lint Firebase Functions
        run: npm --prefix functions run lint

      - name: Test trusted views and reader timing
        run: node --test scripts/test-view-service.mjs scripts/test-chapter-views.mjs scripts/test-view-dashboard.mjs scripts/test-chapter-popularity.mjs

      - name: Test threaded comment validation and UI
        run: node --test scripts/test-comments.mjs scripts/test-firebase-session.mjs

      - name: Test UTC monthly reports, dashboard rollover and export safety
        run: node --test scripts/test-monthly-reports.mjs scripts/test-monthly-report-ui.mjs

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test Firestore view and comment rules and transactions
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-helium-views --config firebase.emulator.json "node --test scripts/test-view-rules.mjs scripts/test-view-firestore.mjs scripts/test-comment-firestore.mjs scripts/test-monthly-report-firestore.mjs"

      - name: Validate team ownership
        run: node scripts/validate-catalogue.mjs

      - name: Test chapter readiness without network or webhook
        run: node --test scripts/test-chapter-readiness.mjs scripts/test-discord-delivery.mjs


      # ==========================
      # GENERATE VERSION
      # ==========================

      - name: Generate data version
        run: |

          HASH=$(sha256sum assets/data/data.json | cut -d ' ' -f1)

          cat > assets/data/version.js <<EOF
          // AUTO-GENERATED BY GITHUB ACTIONS
          window.SITE_VERSION = "${HASH}";
          EOF

          echo "Data version: ${HASH}"


      # ==========================
      # GENERATE SITEMAP
      # ==========================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OG image dependency
        run: python3 -m pip install -r scripts/requirements-og.txt

      - name: Test OG image generator without network
        run: python3 scripts/test-og-images.py

      - name: Generate OG preview images
        run: python3 scripts/generate-og-images.py

      - name: Generate clean routes and sitemap
        run: python3 scripts/build-clean-urls.py

      - name: Upload generated OG images and pages for review
        uses: actions/upload-artifact@v4
        with:
          name: og-preview
          include-hidden-files: true
          path: |
            assets/og/
            manga/
            assets/js/
            assets/css/
            assets/images/
            assets/data/
            sitemap.xml


      # ==========================
      # COMMIT GENERATED FILES
      # ==========================

      - name: Commit generated files
        if: github.event_name == 'push'
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add \
            assets/data/version.js \
            sitemap.xml \
            assets/og \
            login follow history user manga \
            admin/manga admin/chapter

          git diff --cached --quiet || \
            git commit -m "Auto update generated files"

          git push


      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage public website
        run: |
          mkdir -p /tmp/pages-site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.agents/' --exclude='.codex/' --exclude='.aws/' --exclude='.vscode/' --exclude='scripts/' --exclude='worker/' --exclude='functions/' --exclude='firestore/' --exclude='firebase.json' --exclude='firebase.emulator.json' --exclude='firestore.rules' --exclude='firestore.indexes.json' --exclude='node_modules/' ./ /tmp/pages-site/

      # Use the Pages archive format, but replace the artifact on build reruns.
      # upload-pages-artifact does not expose upload-artifact's overwrite input.
      - name: Package Pages artifact
        run: |
          tar --dereference --hard-dereference \
            --directory /tmp/pages-site \
            -cvf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload the single Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages and wait for success
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

  discord:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download generated chapter HTML
        uses: actions/download-artifact@v4
        with:
          name: og-preview
          path: .

      - name: Wait for chapter and OG image, then notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          PUSH_PAYLOAD_FILE: ${{ runner.temp }}/chapter-push-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: node scripts/discord-notify.mjs

      - name: Notify Firebase push backend
        shell: bash
        env:
          PUSH_FUNCTION_URL: ${{ secrets.PUSH_FUNCTION_URL }}
          CHAPTER_NOTIFY_SECRET: ${{ secrets.CHAPTER_NOTIFY_SECRET }}
          PUSH_PAYLOAD_FILE: ${{ runner.temp }}/chapter-push-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          if [ ! -f "$PUSH_PAYLOAD_FILE" ]; then
            echo "No new chapters to notify."
            exit 0
          fi

          : "${PUSH_FUNCTION_URL:?PUSH_FUNCTION_URL secret is required}"
          : "${CHAPTER_NOTIFY_SECRET:?CHAPTER_NOTIFY_SECRET secret is required}"

          jq -c '.[]' "$PUSH_PAYLOAD_FILE" | while IFS= read -r payload; do
            curl --fail-with-body --silent --show-error \
              --proto '=https' --connect-timeout 10 --max-time 60 \
              --request POST \
              --header 'Content-Type: application/json' \
              --header "x-helium-secret: $CHAPTER_NOTIFY_SECRET" \
              --data-binary "$payload" \
              "$PUSH_FUNCTION_URL"
          done
