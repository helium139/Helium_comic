name: Verify application regressions
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - assets/data/data.json
      - assets/data/version.js
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install verification dependencies
        run: |
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
          npm ci --prefix worker --ignore-scripts --no-audit --no-fund
      - name: Verify retirement, login, reading, comments, reports, CMS and publishing
        run: >-
          node --test
          scripts/test-service-worker-retirement.mjs scripts/test-discord-delivery.mjs
          scripts/test-chapter-readiness.mjs scripts/test-firebase-session.mjs
          scripts/test-monthly-reports.mjs scripts/test-reading-progress.mjs
          scripts/test-comments.mjs scripts/test-view-service.mjs
          scripts/test-chapter-views.mjs scripts/test-cms-auth.mjs
          scripts/test-worker-authorization.mjs scripts/test-team-compatibility.mjs
          scripts/test-staff-access.mjs
          scripts/test-admin-team-view.mjs scripts/test-dashboard.mjs
          scripts/test-admin-pagination.mjs scripts/test-chapter-edit-frontend.mjs
          scripts/test-image-conversion.mjs
      - name: Lint Functions
        run: npm --prefix functions run lint
