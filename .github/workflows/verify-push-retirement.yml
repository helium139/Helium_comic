name: Verify push retirement
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install verification dependencies
        run: |
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
          npm ci --prefix worker --ignore-scripts --no-audit --no-fund
      - name: Verify retirement, login, reading, comments, reports, CMS and publishing
        run: >-
          node --test
          scripts/test-push-retirement.mjs scripts/test-discord-delivery.mjs
          scripts/test-chapter-readiness.mjs scripts/test-firebase-session.mjs
          scripts/test-monthly-reports.mjs scripts/test-reading-progress.mjs
          scripts/test-comments.mjs scripts/test-view-service.mjs
          scripts/test-chapter-views.mjs scripts/test-cms-auth.mjs
          scripts/test-worker-authorization.mjs scripts/test-team-compatibility.mjs
          scripts/test-staff-access.mjs scripts/test-current-staff-access.mjs
      - name: Lint Functions
        run: npm --prefix functions run lint

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify current access with local Firestore
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-helium-views --config firebase.emulator.json "node --test scripts/test-current-staff-firestore.mjs scripts/test-view-rules.mjs"
