<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Upload Chapter | Helium CMS</title>

<link
rel="icon"
type="image/png"
href="../assets/images/helium_logo.webp">

<link
rel="stylesheet"
href="admin.css">

<link
href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
rel="stylesheet">

</head>

<body>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

    <div class="logo">

        <img src="../assets/images/helium_logo.webp">

        <h2>Helium CMS</h2>

    </div>

    <a href="index.html">

        <i class='bx bx-home'></i>

        Dashboard

    </a>

    <a href="manga.html">

        <i class='bx bx-book'></i>

        Quản lý truyện

    </a>

    <a class="active" href="chapter.html">

        <i class='bx bx-images'></i>

        Upload Chapter

    </a>

    <a href="../index.html">

        <i class='bx bx-world'></i>

        Website

    </a>

</div>

<!-- ================= CONTENT ================= -->

<div class="content">

<div class="page-header">

<h1 id="pageTitle">

Upload Chapter

</h1>

<button
id="backBtn"
class="secondary-btn hidden">

<i class='bx bx-arrow-back'></i>

Quay lại

</button>

</div>

<div class="upload-layout">

<!-- ================= LEFT ================= -->

<div class="upload-card">

<h2>Thông tin Chapter</h2>

<label>Truyện</label>

<select id="mangaSelect"></select>

<label>Chapter</label>

<input
id="chapterNumber"
type="number"
readonly>

<label>Tiêu đề</label>

<input
id="chapterTitle"
type="text">

<label>Ngày đăng</label>

<input
id="chapterDate"
type="date">

<div class="chapter-info">

<p>

Ảnh:

<strong id="imageCount">

0

</strong>

</p>

<p>

Dung lượng:

<strong id="totalSize">

0 MB

</strong>

</p>

</div>

</div>

<!-- ================= RIGHT ================= -->

<div class="upload-card">

<h2>Upload ảnh</h2>

<div id="dropZone" class="drop-zone">

<input
id="chapterFiles"
type="file"
multiple
hidden>

<i class='bx bx-cloud-upload'></i>

<p>

Kéo ảnh vào đây

</p>

<p>hoặc</p>

<button
id="addImageBtn"
type="button"
class="primary-btn">

<i class='bx bx-image-add'></i>

Chọn ảnh

</button>

</div>

<div id="progress"></div>

<div class="log-box">

<h3>Log</h3>

<div id="uploadLog"></div>

</div>

<h3>

Preview

</h3>

<div
id="preview"
class="preview-grid">

<div class="empty-preview">

Chưa có ảnh

</div>

</div>

<div class="file-info">

<p>

Đã chọn

<strong id="fileCount">

0

</strong>

ảnh

</p>

<p>

Dung lượng

<strong id="fileSize">

0 MB

</strong>

</p>

</div>

<button
id="uploadBtn"
class="primary-btn">

<i class='bx bx-upload'></i>

Upload Chapter

</button>

</div>

</div>

</div>

<!-- Sortable -->

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<script
type="module"
src="chapter.js">

</script>

</body>

</html>
