<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Thêm Chapter</title>

<link rel="stylesheet" href="admin.css">

<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

</head>

<body>

<div class="sidebar">

    <div class="logo">
        <img src="../assets/images/helium_logo.webp">
        <h2>Helium CMS</h2>
    </div>

    <a href="index.html">
        <i class='bx bx-home'></i>
        Dashboard
    </a>

    <a href="manga.html">
        <i class='bx bx-book'></i>
        Quản lý truyện
    </a>

    <a href="chapter.html" class="active">
        <i class='bx bx-file'></i>
        Thêm Chapter
    </a>

    <a href="publish.html">
        <i class='bx bx-upload'></i>
        Publish
    </a>

    <a href="../index.html">
        <i class='bx bx-world'></i>
        Website
    </a>

</div>

<div class="content">

<h1>Upload Chapter</h1>

<div class="card">

<label>Truyện</label>

<select id="mangaSelect"></select>

<label>Số Chapter</label>

<input
type="number"
id="chapterNumber"
placeholder="Ví dụ: 21">

<label>Tiêu đề</label>

<input
type="text"
id="chapterTitle"
placeholder="Chap 21">

<label>Ngày phát hành</label>

<input
type="date"
id="chapterDate">

<label>Chọn ảnh</label>

<input
type="file"
id="chapterFiles"
multiple
accept="image/*">

<br><br>

<button id="uploadBtn">
<i class='bx bx-cloud-upload'></i>
Upload Chapter
</button>

</div>

<div class="card">

<h2>Tiến trình</h2>

<div id="progress">
Chưa upload...
</div>

</div>

</div>

<script type="module" src="chapter.js"></script>

</body>

</html>
