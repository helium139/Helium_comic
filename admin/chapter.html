<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<title>Chapter Manager</title>

<link rel="stylesheet" href="admin.css">
<link rel="icon" type="image/png" href="../assets/images/helium_logo.webp">
<link
href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
rel="stylesheet">

</head>

<body>

<div class="sidebar">

<div class="logo">

<img src="../assets/images/helium_logo.webp">

<h2>Helium CMS</h2>

</div>

<a href="index.html">
<i class='bx bx-home'></i>
Dashboard
</a>

<a href="manga.html">
<i class='bx bx-book'></i>
Quản lý truyện
</a>

<a class="active" href="chapter.html">
<i class='bx bx-file'></i>
Chapter
</a>

<a href="publish.html">
<i class='bx bx-upload'></i>
Publish
</a>

</div>

<div class="content">

<h1>Thêm Chapter</h1>

<div class="editor-card">

<label>Truyện</label>

<select id="mangaSelect"></select>

<label>Số Chapter</label>

<input id="chapterId" type="number">

<label>Tiêu đề</label>

<input id="chapterTitle">

<label>Ngày phát hành</label>

<input
id="chapterDate"
type="date">

<label>Folder Cloudflare</label>

<input
id="chapterFolder"
placeholder="https://pub....../tro-tan/chap15">

<label>Số trang</label>

<input
id="pageCount"
type="number">

<button id="generateBtn">

Sinh JSON

</button>

</div>

<h2>JSON</h2>

<textarea
id="jsonOutput"
rows="18">

</textarea>

</div>

<script type="module" src="chapter.js"></script>

</body>
</html>
