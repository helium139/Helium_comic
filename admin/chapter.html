<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chapter Editor | Helium CMS</title>

<link rel="icon"
type="image/png"
href="../assets/images/helium_logo.webp">

<link
rel="stylesheet"
href="admin.css">

<link
href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
rel="stylesheet">

<!-- Drag & Drop -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>

</head>

<body>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

    <div class="logo">

        <img src="../assets/images/helium_logo.webp">

        <h2>Helium CMS</h2>

    </div>

    <a href="index.html">

        <i class='bx bx-home'></i>

        Dashboard

    </a>

    <a href="manga.html">

        <i class='bx bx-book'></i>

        Quản lý truyện

    </a>

    <a class="active" href="chapter.html">

        <i class='bx bx-images'></i>

        Chapter Editor

    </a>

    <a href="../index.html">

        <i class='bx bx-world'></i>

        Website

    </a>

</div>

<!-- ================= CONTENT ================= -->

<div class="content">

<div class="page-header">

<h1 id="pageTitle">

Upload Chapter

</h1>

<div class="page-actions">

<button
id="backBtn"
class="secondary-btn">

<i class='bx bx-arrow-back'></i>

Quay lại

</button>

</div>

</div>

<div class="chapter-layout">

<!-- LEFT -->

<div class="upload-card">

<h2>

Thông tin Chapter

</h2>

<!-- Upload mode -->

<div id="createMode">

<label>Truyện</label>

<select id="mangaSelect"></select>

<label>Số Chapter</label>

<input
type="number"
id="chapterNumber"
readonly>

</div>

<!-- Edit mode -->

<div id="editMode" class="hidden">

<label>Truyện</label>

<input
id="mangaName"
readonly>

<label>Slug</label>

<input
id="mangaSlug"
readonly>

</div>

<label>Tiêu đề</label>

<input
id="chapterTitle"
type="text">

<label>Ngày đăng</label>

<input
id="chapterDate"
type="date">

<div class="chapter-stats">

<div>

<b id="imageCount">

0

</b>

<span>Ảnh</span>

</div>

<div>

<b id="totalSize">

0 MB

</b>

<span>Dung lượng</span>

</div>

</div>

<div class="log-box">

<h3>

Log

</h3>

<div id="uploadLog"></div>

</div>

</div>

<!-- RIGHT -->

<div class="upload-card">

<div class="preview-header">

<h2>

Danh sách ảnh

</h2>

<div>

<button
id="addImageBtn"
class="secondary-btn">

<i class='bx bx-image-add'></i>

Thêm ảnh

</button>

<input
id="chapterFiles"
type="file"
multiple
hidden>

</div>

</div>

<div
id="dropZone"
class="drop-zone">

<i class='bx bx-cloud-upload'></i>

<p>

Kéo ảnh vào đây hoặc bấm Thêm ảnh

</p>

</div>

<div
id="preview"
class="preview-grid">

<div class="empty-preview">

Chưa có ảnh

</div>

</div>

<div id="progress">

</div>

<div class="editor-actions">

<button
id="uploadBtn"
class="primary-btn">

<i class='bx bx-save'></i>

Lưu thay đổi

</button>

</div>

</div>

</div>

</div>

<script
type="module"
src="chapter.js"></script>

</body>

</html>
