<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comments · Helium CMS</title><link rel="icon" href="/assets/images/helium_logo.webp"><link rel="stylesheet" href="/admin/admin.css">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"></head><body>
<button id="menuToggleBtn" class="menu-toggle-btn">
  <i class="bx bx-menu"></i>
</button>

<div id="adminOverlay" class="admin-overlay"></div>
<div class="sidebar">

    <div class="logo">
        <img src="/assets/images/helium_logo.webp">
        <h2>Helium CMS</h2>
    </div>

    <a href="/admin/">
        <i class='bx bx-home'></i>
        Dashboard
    </a>

    <a href="/admin/manga/">
        <i class='bx bx-book'></i>
        Quản lý truyện
    </a>

    <a href="/admin/chapter/">
        <i class='bx bx-file'></i>
        Thêm Chapter
    </a>

    <a href="/admin/comments/" class="active">
        <i class='bx bx-comment'></i>

    <a href="/admin/reports/" data-admin-report-link hidden>

    <a href="/">

</div>

<section id="comments-content" class="dashboard-manga-section" hidden>

</div>

<div id="comments-list"></div><button id="comments-more" type="button" hidden>Load more comments</button>
</section></main><script type="module" src="/admin/comments.js"></script><script src="/admin/menu.js"></script></body></html>
